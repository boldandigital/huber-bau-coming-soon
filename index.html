<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUBER BAU GmbH — Wir bauen gerade um.</title>
  <meta name="description" content="HUBER BAU GmbH, Bauunternehmen aus Ravensburg (Oberschwaben). Unsere neue Website entsteht gerade." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      /* HUBER BAU brand tokens — locked from app/globals.css */
      --hb-paper:        #FAFAF7;
      --hb-paper-warm:   #F5F4EF;
      --hb-paper-soft:   #F3F4E9;
      --hb-mineral:      #EDEFDD;
      --hb-lime:         #D8E84A;
      --hb-lime-soft:    #ECF2DF;
      --hb-ink:          #1A1A18;
      --hb-ink-2:        #2A2A27;
      --hb-mid:          #5C5B53;
      --hb-mid-2:        #6F6E65;
      --hb-mid-3:        #8A897F;
      --hb-line:         #DEDDD5;
      --hb-line-soft:    #D3D4BE;
      --hb-concrete:     #C9C7BB;

      --type-display: clamp(2.5rem, 4.6vw, 4.875rem);
      --type-h2:      clamp(2.625rem, 4.6vw, 5rem);
      --type-h3:      clamp(1.5rem, 2.2vw, 2.125rem);
      --type-body:    1.0625rem;
      --type-mono:    0.6875rem;
      --letter-mono:  0.15em;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: var(--type-body);
      line-height: 1.55;
      color: var(--hb-ink);
      background: linear-gradient(180deg, var(--hb-paper) 0%, var(--hb-paper-warm) 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::selection { background: var(--hb-lime); color: var(--hb-ink); }
    a { color: inherit; text-decoration: none; }

    /* Radial lime wash behind the SVG (matches hb-hero__wash) */
    .bg-wash {
      position: fixed;
      top: -18%;
      left: -8%;
      width: 80vw;
      height: 80vw;
      max-width: 1200px;
      max-height: 1200px;
      background: radial-gradient(circle at center, rgba(216, 232, 74, 0.22) 0%, rgba(216, 232, 74, 0) 60%);
      pointer-events: none;
      z-index: 0;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }
    .hero__stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 32px 120px;
    }
    .hero__stage-inner {
      flex: 0 0 auto;
      width: 100%;
      max-width: 1180px;
      transform-origin: 50% 50%;
    }
    .hb-hero__svg {
      width: 100%;
      max-width: 1180px;
      height: auto;
      max-height: 70vh;
      overflow: visible;
      display: block;
    }

    /* Bottom-center info card — relative, embedded halfway up the hero drawing */
    .hero__card-wrap {
      position: relative;
      margin: -360px auto 0;
      width: min(560px, calc(100vw - 32px));
      z-index: 3;
    }
    .hero__card {
      background: rgba(250, 250, 247, 0.86);
      backdrop-filter: blur(12px) saturate(1.05);
      -webkit-backdrop-filter: blur(12px) saturate(1.05);
      border-top: 2px solid var(--hb-lime);
      padding: 28px 32px 30px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--type-mono);
      font-weight: 500;
      letter-spacing: var(--letter-mono);
      text-transform: uppercase;
      color: var(--hb-mid-2);
      margin-bottom: 14px;
    }
    .accent-square {
      width: 9px;
      height: 9px;
      background: var(--hb-lime);
      flex-shrink: 0;
    }
    .card__title {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 3.2vw, 2.625rem);
      line-height: 1.04;
      letter-spacing: -0.018em;
      color: var(--hb-ink);
      margin: 0 0 14px 0;
    }
    .card__sub {
      font-family: 'Archivo', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      line-height: 1.55;
      color: var(--hb-mid-2);
      margin: 0 0 22px 0;
    }
    .card__contacts {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
    }
    .card__contact {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 18px;
      align-items: baseline;
      padding: 12px 0;
      border-top: 1px solid var(--hb-line);
    }
    .card__contact:last-child { border-bottom: 1px solid var(--hb-line); }
    .card__contact dt {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--type-mono);
      font-weight: 500;
      letter-spacing: var(--letter-mono);
      text-transform: uppercase;
      color: var(--hb-mid-2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
    }
    .card__contact dd {
      font-family: 'Archivo', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      color: var(--hb-ink);
      margin: 0;
    }
    .card__contact dd a {
      color: var(--hb-ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 200ms ease;
    }
    .card__contact dd a:hover { border-bottom-color: var(--hb-lime); }

    /* Footer */
    .foot {
      position: relative;
      z-index: 3;
      background: var(--hb-ink);
      color: var(--hb-paper-warm);
      padding: 22px 32px;
      flex-shrink: 0;
    }
    .foot__inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      max-width: 1320px;
      margin: 0 auto;
    }
    .foot__mark {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      font-family: 'Archivo', sans-serif;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: 0.005em;
    }
    .wordmark--light { color: var(--hb-paper-warm); }
    .wordmark__a { font-weight: 900; }
    .wordmark__bar {
      display: inline-block;
      width: 3px;
      height: 1.05em;
      background: var(--hb-lime);
      margin: 0 0.42em;
      flex-shrink: 0;
    }
    .wordmark__b { font-weight: 400; }
    .foot__copy {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--type-mono);
      font-weight: 400;
      letter-spacing: var(--letter-mono);
      color: var(--hb-mid-3);
      text-transform: uppercase;
    }
    .foot__link {
      font-family: 'IBM Plex Mono', monospace;
      font-size: var(--type-mono);
      font-weight: 500;
      letter-spacing: var(--letter-mono);
      color: var(--hb-paper-warm);
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 200ms ease;
    }
    .foot__link:hover { border-bottom-color: var(--hb-lime); }

    @media (max-width: 720px) {
      .hero__stage { padding: 32px 20px 240px; }
      .hb-hero__svg { max-height: 50vh; }
      .hero__card-wrap { margin: -240px auto 0; width: calc(100vw - 32px); }
      .hero__card { padding: 22px 22px 24px; }
      .card__contact { grid-template-columns: 88px 1fr; gap: 12px; }
      .foot__inner { flex-direction: column; align-items: flex-start; gap: 14px; }
      .foot__mark { flex-direction: column; align-items: flex-start; gap: 8px; }
    }

    /* Reduced-motion fallback: jump straight to the final composition */
    @media (prefers-reduced-motion: reduce) {
      .hb-hero__svg [data-fx] { opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      .hero__stage-inner { transform: none !important; }
    }

    @media print {
      body { background: var(--hb-paper); color: var(--hb-ink); }
      .bg-wash { display: none; }
      .hb-hero__svg { max-height: 28vh; }
      .hero__card-wrap { position: static; transform: none; width: 100%; margin: 16px auto 24px; }
      .hero__card {
        background: var(--hb-paper);
        backdrop-filter: none; -webkit-backdrop-filter: none;
        border: 1px solid var(--hb-line);
        border-top: 2px solid var(--hb-lime);
      }
      .foot { background: var(--hb-paper); color: var(--hb-ink); border-top: 1px solid var(--hb-line); }
      .wordmark--light, .foot__link { color: var(--hb-ink); }
    }
    @page { size: A4; margin: 18mm; }
  </style>
</head>

  <script>
  /* Autoplay engine — same animation semantics as lib/useHeroScroll.ts,
     but driven by absolute time t in [0,1] instead of scroll progress p.
     Animation timing is mapped from each element's data-r="a,b" range:
       a → AUTOPLAY_MS * a   (start)
       b → AUTOPLAY_MS * b   (end)
     After t reaches 1.0, the final state is held indefinitely. */
  (function () {
    var AUTOPLAY_MS = 9500;
    var hero = document.getElementById('hb-stage-inner');
    if (!hero) return;
    var svg = hero.querySelector('svg');
    if (!svg) return;

    var wipeRect = document.getElementById('hb-wipe-rect');
    var wipeEdge = document.getElementById('hb-wipe-edge');
    var sweep = document.getElementById('hb-sweep');

    // Easings copied verbatim from useHeroScroll.ts
    var ez  = function (t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; };
    var ezo = function (t) { return 1 - Math.pow(1 - t, 3); };
    var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
    var seg = function (p, a, b) { return clamp((p - a) / (b - a), 0, 1); };

    // Pre-compute per-element FX state
    var fx = Array.prototype.map.call(
      hero.querySelectorAll('[data-fx]'),
      function (el) {
        var r = (el.dataset.r || '0,1').split(',').map(Number);
        var kind = el.dataset.fx || 'in';
        var node = {
          el: el,
          kind: kind,
          a: r[0] || 0,
          b: r[1] || 1,
          oa: null, ob: null,
          L: 0
        };
        if (el.dataset.out) {
          var q = el.dataset.out.split(',').map(Number);
          node.oa = q[0];
          node.ob = q[1];
        }
        if (kind === 'draw') {
          try {
            node.L = el.getTotalLength();
          } catch (e) { node.L = 1; }
          el.style.strokeDasharray = node.L + ' ' + node.L;
          el.style.strokeDashoffset = node.L;
        } else if (kind === 'in' || kind === 'rise' || kind === 'slide') {
          el.style.opacity = '0';
        }
        return node;
      }
    );

    var start = null;
    function apply(p) {
      for (var i = 0; i < fx.length; i++) {
        var f = fx[i];
        var k = seg(p, f.a, f.b);
        if (f.kind === 'draw') {
          f.el.style.strokeDashoffset = String(f.L * (1 - k));
          if (f.oa != null && f.ob != null) {
            f.el.style.opacity = String(1 - seg(p, f.oa, f.ob));
          }
        } else if (f.kind === 'in') {
          var o = ez(k);
          if (f.oa != null && f.ob != null) o *= 1 - seg(p, f.oa, f.ob);
          f.el.style.opacity = String(o);
        } else if (f.kind === 'rise') {
          f.el.style.transform = 'scaleY(' + ezo(k) + ')';
          var oo = k > 0.001 ? 1 : 0;
          if (f.oa != null && f.ob != null) oo *= 1 - seg(p, f.oa, f.ob);
          f.el.style.opacity = String(oo);
        } else if (f.kind === 'slide') {
          f.el.style.transform = 'scaleX(' + ezo(k) + ')';
          var oo2 = k > 0.001 ? 1 : 0;
          if (f.oa != null && f.ob != null) oo2 *= 1 - seg(p, f.oa, f.ob);
          f.el.style.opacity = String(oo2);
        }
      }
      // Material wipe: rect width grows 0 → 1600 between p=0.48 and p=0.72
      if (wipeRect) {
        var w = 1600 * ez(seg(p, 0.48, 0.72));
        wipeRect.setAttribute('width', String(w));
      }
      // Lime wipe edge tracks the wipe
      if (wipeEdge) {
        var ww = 1600 * ez(seg(p, 0.48, 0.72));
        wipeEdge.setAttribute('x', String(clamp(ww - 2, 0, 1596)));
        wipeEdge.style.opacity = String(seg(p, 0.47, 0.51) * (1 - seg(p, 0.70, 0.74)));
      }
      // Glass sweep — diagonal white sheen moves across the facade
      if (sweep) {
        var sx = -600 + 2800 * ez(seg(p, 0.74, 0.92));
        sweep.setAttribute('transform', 'translate(' + sx + ',0) skewX(-16)');
      }
    }

    function tick(ts) {
      if (start === null) start = ts;
      var elapsed = ts - start;
      var p = clamp(elapsed / AUTOPLAY_MS, 0, 1);
      apply(p);
      if (p < 1) requestAnimationFrame(tick);
      else {
        // Hold the final composition with a subtle lime tint surge (matches chapter 6)
        hero.style.transform = '';
      }
    }

    // Honor reduced motion: skip autoplay, jump to final composition
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      apply(1);
    } else {
      requestAnimationFrame(tick);
    }
  })();
  </script>
